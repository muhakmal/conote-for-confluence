<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blue-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-grad)" rx="16" />

  <!-- App Window Container with Shadow -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="1120" height="620" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

    <!-- Window Header / Titlebar -->
    <rect width="1120" height="44" rx="12" fill="#0d1117" />
    <rect y="36" width="1120" height="8" fill="#0d1117" />
    <line x1="0" y1="44" x2="1120" y2="44" stroke="#30363d" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="24" cy="22" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="44" cy="22" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="64" cy="22" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- Document Title in Titlebar -->
    <text x="560" y="27" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle" class="sans">
      CoNote — [ARCH-202] Core Payment Router &amp; Circuit Breaker
    </text>

    <!-- Cloud Connection Indicator -->
    <circle cx="1040" cy="22" r="4" fill="#3fb950" />
    <text x="1052" y="26" fill="#8b949e" font-size="11" class="sans">Cloud Connected</text>

    <!-- Window Layout Grid -->
    <!-- Column 1: Left Space Navigator Sidebar (width 220) -->
    <rect x="0" y="44" width="220" height="526" fill="#0d1117" />
    <line x1="220" y1="44" x2="220" y2="570" stroke="#30363d" stroke-width="1" />

    <!-- Sidebar Content -->
    <text x="20" y="74" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.5" class="sans">CONFLUENCE SPACES</text>
    <rect x="14" y="86" width="192" height="26" rx="5" fill="#21262d" />
    <text x="24" y="103" fill="#58a6ff" font-size="12" font-weight="600" class="sans">▼ Core Engineering (ENG)</text>

    <text x="34" y="130" fill="#8b949e" font-size="12" class="sans">📁 Architecture RFCs</text>
    
    <!-- Active Page highlight -->
    <rect x="30" y="142" width="180" height="24" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
    <text x="44" y="158" fill="#58a6ff" font-size="12" font-weight="500" class="sans">📄 [ARCH-202] Payment Router</text>

    <text x="44" y="185" fill="#c9d1d9" font-size="12" class="sans">📄 [ARCH-201] Auth Token</text>
    <text x="34" y="210" fill="#8b949e" font-size="12" class="sans">📁 Infrastructure Specs</text>
    <text x="44" y="235" fill="#c9d1d9" font-size="12" class="sans">📄 Ingress Routing K8s</text>

    <line x1="14" y1="260" x2="206" y2="260" stroke="#21262d" stroke-width="1" />
    <text x="20" y="285" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.5" class="sans">LOCAL DRAFTS</text>
    <text x="34" y="310" fill="#e3b341" font-size="12" class="sans">• Webhook Engine (wip)</text>
    <text x="34" y="335" fill="#c9d1d9" font-size="12" class="sans">• Redis Partitioning RFC</text>

    <!-- Column 2: Markdown Editor (width 450) -->
    <rect x="220" y="44" width="450" height="526" fill="#161b22" />
    <line x1="670" y1="44" x2="670" y2="570" stroke="#30363d" stroke-width="1" />

    <!-- Editor Tab / Header -->
    <rect x="220" y="44" width="450" height="32" fill="#0d1117" />
    <text x="236" y="65" fill="#58a6ff" font-size="12" font-weight="600" class="sans">MARKDOWN EDITOR</text>
    <text x="630" y="65" fill="#8b949e" font-size="11" class="mono">UTF-8</text>
    <line x1="220" y1="76" x2="670" y2="76" stroke="#21262d" stroke-width="1" />

    <!-- Editor Code Lines -->
    <g class="mono" font-size="12">
      <!-- Line 1 -->
      <text x="236" y="105" fill="#484f58">1</text>
      <text x="260" y="105" fill="#ff7b72"># [ARCH-202] Payment Router</text>

      <!-- Line 2 -->
      <text x="236" y="130" fill="#484f58">2</text>
      <text x="260" y="130" fill="#79c0ff">&gt; [!NOTE]</text>

      <!-- Line 3 -->
      <text x="236" y="155" fill="#484f58">3</text>
      <text x="260" y="155" fill="#a5d6ff">&gt; Zero-downtime automated failover specs.</text>

      <!-- Line 4 -->
      <text x="236" y="180" fill="#484f58">4</text>

      <!-- Line 5 -->
      <text x="236" y="205" fill="#484f58">5</text>
      <text x="260" y="205" fill="#ff7b72">## System Flow</text>

      <!-- Line 6 -->
      <text x="236" y="230" fill="#484f58">6</text>
      <text x="260" y="230" fill="#7ee787">```mermaid</text>

      <!-- Line 7 -->
      <text x="236" y="255" fill="#484f58">7</text>
      <text x="260" y="255" fill="#c9d1d9">flowchart LR</text>

      <!-- Line 8 -->
      <text x="236" y="280" fill="#484f58">8</text>
      <text x="260" y="280" fill="#c9d1d9">  Client --&gt; Router --&gt; Gateway</text>

      <!-- Line 9 -->
      <text x="236" y="305" fill="#484f58">9</text>
      <text x="260" y="305" fill="#7ee787">```</text>

      <!-- Line 10 -->
      <text x="236" y="330" fill="#484f58">10</text>

      <!-- Line 11 -->
      <text x="236" y="355" fill="#484f58">11</text>
      <text x="260" y="355" fill="#79c0ff">| Partner | SLA | Fallback |</text>

      <!-- Line 12 -->
      <text x="236" y="380" fill="#484f58">12</text>
      <text x="260" y="380" fill="#79c0ff">| WinPay  | 99.9%| Direct   |</text>
    </g>

    <!-- Column 3: Live Preview & Diagrams (width 450) -->
    <rect x="670" y="44" width="450" height="526" fill="#0d1117" />

    <!-- Preview Header -->
