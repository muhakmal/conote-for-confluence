    <rect x="1030" y="52" width="70" height="18" rx="3" fill="#238636" fill-opacity="0.3" stroke="#238636" stroke-width="1" />
    <text x="1040" y="65" fill="#3fb950" font-size="10" font-weight="600" class="sans">XHTML OK</text>
    <line x1="670" y1="76" x2="1120" y2="76" stroke="#21262d" stroke-width="1" />

    <!-- Rendered Title -->
    <text x="696" y="110" fill="#ffffff" font-size="18" font-weight="700" class="sans">[ARCH-202] Payment Router</text>

    <!-- Rendered Confluence Note Macro Panel -->
    <rect x="696" y="125" width="400" height="42" rx="4" fill="#0c2d6b" fill-opacity="0.35" stroke="#1f6feb" stroke-width="1" />
    <circle cx="714" cy="146" r="8" fill="#1f6feb" />
    <text x="712" y="150" fill="#ffffff" font-size="11" font-weight="700" class="sans">i</text>
    <text x="732" y="150" fill="#a5d6ff" font-size="12" class="sans">Zero-downtime automated failover specs.</text>

    <!-- Rendered Mermaid Diagram Box -->
    <rect x="696" y="180" width="400" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="710" y="202" fill="#8b949e" font-size="11" font-weight="600" class="sans">ARCHITECTURE FLOWCHART</text>

    <!-- Diagram Node 1 -->
    <rect x="716" y="225" width="80" height="34" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
    <text x="738" y="246" fill="#c9d1d9" font-size="12" font-weight="600" class="sans">Client</text>

    <!-- Arrow 1 -->
    <line x1="796" y1="242" x2="840" y2="242" stroke="#8b949e" stroke-width="1.5" />
    <polygon points="840,242 834,238 834,246" fill="#8b949e" />

    <!-- Diagram Node 2 -->
    <rect x="846" y="220" width="90" height="44" rx="4" fill="#1f6feb" fill-opacity="0.3" stroke="#388bfd" stroke-width="2" />
    <text x="868" y="246" fill="#ffffff" font-size="12" font-weight="700" class="sans">Router</text>

    <!-- Arrow 2 -->
    <line x1="936" y1="242" x2="980" y2="242" stroke="#8b949e" stroke-width="1.5" />
    <polygon points="980,242 974,238 974,246" fill="#8b949e" />

    <!-- Diagram Node 3 -->
    <rect x="986" y="225" width="90" height="34" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
    <text x="1006" y="246" fill="#c9d1d9" font-size="12" font-weight="600" class="sans">Gateway</text>

    <!-- Rendered Confluence Table -->
    <g transform="translate(696, 330)">
      <rect width="400" height="75" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <rect width="400" height="26" rx="4" fill="#21262d" />
      <line x1="0" y1="26" x2="400" y2="26" stroke="#30363d" stroke-width="1" />
      <line x1="0" y1="51" x2="400" y2="51" stroke="#21262d" stroke-width="1" />

      <!-- Table Header -->
      <text x="16" y="18" fill="#f0f6fc" font-size="11" font-weight="600" class="sans">PARTNER</text>
      <text x="160" y="18" fill="#f0f6fc" font-size="11" font-weight="600" class="sans">SLA</text>
      <text x="280" y="18" fill="#f0f6fc" font-size="11" font-weight="600" class="sans">STATUS</text>

      <!-- Table Row -->
      <text x="16" y="42" fill="#c9d1d9" font-size="12" class="sans">WinPay Gateway</text>
      <text x="160" y="42" fill="#c9d1d9" font-size="12" class="sans">99.9%</text>
      
      <!-- Status Chip -->
      <rect x="280" y="32" width="60" height="16" rx="3" fill="#238636" fill-opacity="0.3" />
      <text x="294" y="44" fill="#3fb950" font-size="10" font-weight="600" class="sans">ACTIVE</text>
    </g>

    <!-- Footer Action Bar (height 50) -->
    <rect y="570" width="1120" height="50" rx="12" fill="#0d1117" />
    <rect y="570" width="1120" height="12" fill="#0d1117" />
    <line x1="0" y1="570" x2="1120" y2="570" stroke="#30363d" stroke-width="1" />

    <!-- Action Buttons -->
    <rect x="20" y="580" width="200" height="30" rx="6" fill="url(#blue-btn)" />
    <text x="120" y="600" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" class="sans">
      🚀 Publish to Confluence (⌘P)
    </text>

    <rect x="230" y="580" width="140" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="300" y="600" fill="#c9d1d9" font-size="12" font-weight="500" text-anchor="middle" class="sans">
      💾 Save Draft (⌘S)
    </text>

    <rect x="380" y="580" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="445" y="600" fill="#c9d1d9" font-size="12" font-weight="500" text-anchor="middle" class="sans">
      🕒 History (12 revs)
    </text>

    <!-- Status text right -->
    <text x="1100" y="600" fill="#8b949e" font-size="11" text-anchor="end" class="sans">
      Last synced: 2m ago • Port 0 Dynamic • Token: Keychain Encrypted
    </text>
  </g>
</svg>
